name: Deploy website to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Assemble static site
        run: |
          mkdir -p _site
          cp -R dist/. _site/
          # mockdemo: test version of the site, published under /mockdemo/ (built by scripts/demos/build_mockdemo.py of the worker repository)
          if [ -d mockdemo ]; then mkdir -p _site/mockdemo && cp -R mockdemo/. _site/mockdemo/; fi
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      # the deploy step looks the artifact up by name; on 23 November 2026 the listing lagged a few seconds behind the upload and the deployment failed
      - name: Wait until the uploaded artifact is listed
        run: sleep 30
      - id: deployment
        uses: actions/deploy-pages@v4
